name: Deploy to GitHub Pages

# This app imports its design system from "../lyra-ui/src" (plus
# "../lyra-ui/tailwind-tokens.cjs" for Tailwind's color tokens) — a sibling
# folder that lives outside this repo on Dave's machine, and whose
# node_modules this repo's own node_modules is normally just a symlink to
# (see `ls -la node_modules` locally). Since the real lyra-ui project isn't
# (yet) its own git repo or published package, a snapshot of it is vendored
# here at .vendor/lyra-ui/ (src/, tailwind-tokens.cjs, package.json,
# package-lock.json). The steps below recreate that same layout on the
# runner — sibling folder + symlinked node_modules — before building.
# See .vendor/lyra-ui/README.md for how to refresh the snapshot.
#
# Step order matters: "Install app dependencies" must run BEFORE the
# symlink step. This app's own package.json has no dependencies of its
# own yet, but `npm install` still touches `node_modules` as part of its
# normal bookkeeping — if a symlink is already sitting there, npm deletes
# it (logged as "npm warn reify Removing non-directory ... node_modules"),
# silently breaking every import in the build that follows. Verified by
# reproducing this exact sequence in a scratch copy before relying on it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize sibling lyra-ui from vendored snapshot
        run: |
          cp -R .vendor/lyra-ui "${{ github.workspace }}/../lyra-ui"
          cd "${{ github.workspace }}/../lyra-ui"
          npm ci

      # No dependencies of its own today (see the symlink step below) —
      # this is a no-op until/unless the app gets a package.json with real
      # deps, kept here so that transition doesn't silently need a
      # workflow edit. Must run before the symlink step (see note above).
      - name: Install app dependencies
        run: npm install

      - name: Link node_modules to the sibling lyra-ui (mirrors local dev)
        run: ln -sf ../lyra-ui/node_modules node_modules

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
